name: Build, Test and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    # 自建 self-hosted runner，装在 pve001 上，跑 CI 不消耗 GitHub 账号的
    # Actions 额度。（此前跑在 gcp-tw3 的 ephemeral runner 上，已迁移到
    # pve001）
    runs-on: [self-hosted, pve001, caddy-trojan]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Date-Based Tag and Image Names
        id: prep
        run: |
          TAG_DATE=$(date +%Y%m%d.%H%M)
          GHCR_IMAGE="ghcr.io/${{ github.repository_owner }}/caddy-trojan"
          GHCR_IMAGE=$(echo "$GHCR_IMAGE" | tr '[:upper:]' '[:lower:]')
          
          # 动态拼接带日期版本号的标签
          TAGS="${GHCR_IMAGE}:${TAG_DATE}"
          
          # 动态拼接 latest 标签
          LATEST_TAGS="${GHCR_IMAGE}:latest"
          
          # 判定是否追加 Docker Hub 标签 (通过环境变量中介，防止 Shell 注入/报错)
          DOCKERHUB_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          DOCKERHUB_PASS="${{ secrets.DOCKERHUB_PASSWORD }}"
          
          if [ -n "$DOCKERHUB_USER" ] && [ -n "$DOCKERHUB_PASS" ]; then
            # 统一转为小写以防命名空间大小写冲突报错
            DOCKERHUB_USER_LOWER=$(echo "$DOCKERHUB_USER" | tr '[:upper:]' '[:lower:]')
            DOCKERHUB_IMAGE="${DOCKERHUB_USER_LOWER}/caddy-trojan"
            TAGS="${TAGS},${DOCKERHUB_IMAGE}:${TAG_DATE}"
            LATEST_TAGS="${LATEST_TAGS},${DOCKERHUB_IMAGE}:latest"
            echo "Info: Docker Hub tags will be included."
          else
            echo "Warning: DOCKERHUB_USERNAME or DOCKERHUB_PASSWORD secret is missing. Skipping Docker Hub push."
          fi
          
          echo "tag_date=${TAG_DATE}" >> $GITHUB_OUTPUT
          echo "ghcr_image=${GHCR_IMAGE}" >> $GITHUB_OUTPUT
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "latest_tags=${LATEST_TAGS}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录 GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 登录 Docker Hub (仅在 Secrets 存在时才登录)
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_PASS: ${{ secrets.DOCKERHUB_PASSWORD }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        if: env.DOCKERHUB_PASS != '' && env.DOCKERHUB_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # 构建并推送带日期版本号的镜像
      - name: Build and Push Date Tag
        uses: docker/build-push-action@v5
        with:
          context: ./Dockerfiles
          file: ./Dockerfiles/Dockerfile
          push: true
          tags: ${{ steps.prep.outputs.tags }}
          platforms: linux/amd64,linux/arm64

      # ==== 对新镜像进行 caddyray 兼容性测试 ====
      - name: Validate Generated Caddyfile
        run: |
          # 镜像已不再内置默认 Caddyfile；这里启动容器让 entrypoint 动态生成配置，再校验其语法合法性
          docker run -d --name caddy-gen-test \
            -e MYPASSWD="testpassword123" \
            -e MYDOMAIN="localhost" \
            -e MYDOMAINCF="localhostcf" \
            ${{ steps.prep.outputs.ghcr_image }}:${{ steps.prep.outputs.tag_date }}
          sleep 5
          docker exec caddy-gen-test caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker rm -f caddy-gen-test

      - name: Run Integration & Stealth 503 Test
        run: |
          # 启动测试容器，注入 caddyray 常用的环境变量
          docker run -d --name caddy-trojan-test \
            -p 8443:443 \
            -p 8080:80 \
            -e MYPASSWD="testpassword123" \
            -e MYDOMAIN="localhost" \
            -e MYDOMAINCF="localhostcf" \
            ${{ steps.prep.outputs.ghcr_image }}:${{ steps.prep.outputs.tag_date }}
          
          # 等待 Caddy 启动并完成自签证书配置
          sleep 5
          
          # 检查容器状态是否为 running
          if [ "$(docker inspect -f '{{.State.Running}}' caddy-trojan-test)" != "true" ]; then
            echo "Error: Container crashed upon startup!"
            docker logs caddy-trojan-test
            exit 1
          fi
          
          # 测试 503 阻断行为：请求直连域名 localhost 应当直接返回 503
          # 使用 curl -k (忽略自签名证书错)
          echo "Testing direct domain 503 blockage..."
          HTTP_STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" https://localhost:8443)
          if [ "$HTTP_STATUS" != "503" ]; then
            echo "Error: Direct domain did not return 503! Returned status: $HTTP_STATUS"
            docker logs caddy-trojan-test
            exit 1
          fi
          echo "Success: Direct domain correctly returned 503."

          # 停止并清理测试容器
          docker stop caddy-trojan-test
          docker rm caddy-trojan-test

      # ==== 测试编号多入口（MYDOMAIN_NN / MYDOMAIN_CF_NN / MYPROXY_NN）====
      - name: Run Numbered Multi-Domain Entry Test
        run: |
          # 01：直连域名 + 指定出站代理；02：仅 CDN 域名、不设代理（应回退 no_proxy）；
          # 默认入口保持不变，验证新功能不影响旧行为。
          docker run -d --name caddy-multi-test \
            -e MYPASSWD="testpassword123" \
            -e MYDOMAIN="localhost" \
            -e MYDOMAIN_01="jp.localhost" \
            -e MYPROXY_01="127.0.0.1:1080" \
            -e MYDOMAIN_CF_02="us-cf.localhost" \
            ${{ steps.prep.outputs.ghcr_image }}:${{ steps.prep.outputs.tag_date }}
          sleep 5

          if [ "$(docker inspect -f '{{.State.Running}}' caddy-multi-test)" != "true" ]; then
            echo "Error: Container crashed upon startup with numbered profiles set!"
            docker logs caddy-multi-test
            exit 1
          fi

          echo "Validating generated Caddyfile..."
          docker exec caddy-multi-test caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

          echo "Checking named_proxy / proxy_name wiring..."
          GENERATED=$(docker exec caddy-multi-test cat /etc/caddy/Caddyfile)
          for pattern in \
            "named_proxy 01 socks_proxy 127.0.0.1:1080" \
            "named_proxy 02 no_proxy" \
            "proxy_name 01" \
            "proxy_name 02"; do
            if ! echo "$GENERATED" | grep -qF "$pattern"; then
              echo "Error: expected line not found in generated Caddyfile: $pattern"
              echo "$GENERATED"
              exit 1
            fi
          done
          echo "Success: numbered multi-domain entries generated correctly."

          docker stop caddy-multi-test
          docker rm caddy-multi-test

      # ==== 测试可选的 ACME DNS-01（CF_DNS_API_TOKEN）====
      - name: Test Optional ACME DNS-01 via Cloudflare
        run: |
          # 设置 token：全局应出现 acme_dns cloudflare，且 token 只以 {env.*} 占位符引用、
          # 明文不出现在 Caddyfile 里；caddy-dns/cloudflare 模块必须已编译进镜像。
          # 这里用公网形式的域名（example.com 子域），不能用 localhost：Caddy 对 localhost
          # 一律用内置 CA，不会生成 ACME issuer，adapt 后也就看不到 DNS 验证配置。
          # 容器起来后会真的去尝试签发并失败（假 token），不影响这里只检查配置。
          docker run -d --name caddy-dns-test \
            -e MYPASSWD="testpassword123" \
            -e MYDOMAIN="dns-test.example.com" \
            -e MYDOMAINCF="dns-test-cf.example.com" \
            -e MYDOMAIN_01="dns-test-jp.example.com" \
            -e MYPROXY_01="127.0.0.1:1080" \
            -e CF_DNS_API_TOKEN="ci-dummy-token-do-not-leak" \
            ${{ steps.prep.outputs.ghcr_image }}:${{ steps.prep.outputs.tag_date }}
          sleep 5
          if [ "$(docker inspect -f '{{.State.Running}}' caddy-dns-test)" != "true" ]; then
            echo "Error: container crashed with CF_DNS_API_TOKEN set"; docker logs caddy-dns-test; exit 1
          fi
          docker exec caddy-dns-test caddy list-modules | grep -qx "dns.providers.cloudflare" \
            || { echo "Error: dns.providers.cloudflare module missing"; exit 1; }
          docker exec caddy-dns-test caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          GENERATED=$(docker exec caddy-dns-test cat /etc/caddy/Caddyfile)
          echo "$GENERATED" | grep -qF 'acme_dns cloudflare {env.CF_DNS_API_TOKEN}' \
            || { echo "Error: acme_dns line missing"; echo "$GENERATED"; exit 1; }
          if echo "$GENERATED" | grep -qF 'ci-dummy-token-do-not-leak'; then
            echo "Error: token leaked into Caddyfile in plain text"; exit 1
          fi
          ADAPTED=$(docker exec caddy-dns-test caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile)
          # 每个 ACME issuer（Let's Encrypt / ZeroSSL）都要带上 cloudflare 的 DNS 验证
          ACME_N=$(echo "$ADAPTED" | grep -o '"module":"acme"' | wc -l)
          DNS_N=$(echo "$ADAPTED" | grep -o '"name":"cloudflare"' | wc -l)
          echo "acme issuers: $ACME_N, cloudflare dns providers: $DNS_N"
          if [ "$ACME_N" -lt 1 ] || [ "$DNS_N" -lt "$ACME_N" ]; then
            echo "Error: not every ACME issuer uses the cloudflare DNS challenge"; echo "$ADAPTED"; exit 1
          fi
          docker rm -f caddy-dns-test

          # 不设置 token：不应生成 acme_dns（保持旧行为）
          docker run -d --name caddy-nodns-test \
            -e MYPASSWD="testpassword123" \
            -e MYDOMAIN="localhost" \
            ${{ steps.prep.outputs.ghcr_image }}:${{ steps.prep.outputs.tag_date }}
          sleep 5
          if docker exec caddy-nodns-test cat /etc/caddy/Caddyfile | grep -q acme_dns; then
            echo "Error: acme_dns generated without CF_DNS_API_TOKEN"; exit 1
          fi
          docker rm -f caddy-nodns-test
          echo "Success: optional DNS-01 generated correctly."

      # ==== 测试「自带 Caddyfile」模式：挂载用户自定义 Caddyfile，且不传 MYPASSWD/MYDOMAIN ====
      - name: Test Bring-Your-Own Caddyfile Mode
        run: |
          # 生成一个最小化的自定义 Caddyfile（不依赖 trojan/域名）
          printf '%s\n' \
            '{' \
            '    admin off' \
            '}' \
            ':9000 {' \
            '    respond "custom-ok" 200' \
            '}' > /tmp/custom.Caddyfile

          # 故意不传 MYPASSWD / MYDOMAIN，验证挂载的 Caddyfile 会被原样使用
          docker run -d --name caddy-byo-test \
            -p 9000:9000 \
            -v /tmp/custom.Caddyfile:/etc/caddy/Caddyfile \
            ${{ steps.prep.outputs.ghcr_image }}:${{ steps.prep.outputs.tag_date }}
          sleep 5

          if [ "$(docker inspect -f '{{.State.Running}}' caddy-byo-test)" != "true" ]; then
            echo "Error: BYO-Caddyfile container crashed upon startup!"
            docker logs caddy-byo-test
            exit 1
          fi

          # 确认进入了「自带 Caddyfile」模式
          if ! docker logs caddy-byo-test 2>&1 | grep -q "user-provided"; then
            echo "Error: Did not enter bring-your-own-Caddyfile mode!"
            docker logs caddy-byo-test
            exit 1
          fi

          # 确认服务的是用户的 Caddyfile（返回 custom-ok）
          BODY=$(curl -s http://localhost:9000)
          if [ "$BODY" != "custom-ok" ]; then
            echo "Error: Custom Caddyfile was not served! Got: $BODY"
            docker logs caddy-byo-test
            exit 1
          fi
          echo "Success: Bring-your-own-Caddyfile mode works as expected."

          docker stop caddy-byo-test
          docker rm caddy-byo-test

      # ==== 测试通过：将该日期镜像晋升为 latest 标签并推送 ====
      # 只在 main 上晋升：在功能分支上手动触发（workflow_dispatch）时只推日期标签，
      # 用来先跑完整测试，不会提前改动生产节点拉取的 latest
      - name: Promote and Push latest Tag
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./Dockerfiles
          file: ./Dockerfiles/Dockerfile
          push: true
          tags: ${{ steps.prep.outputs.latest_tags }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=${{ steps.prep.outputs.ghcr_image }}:buildcache
          cache-to: type=registry,ref=${{ steps.prep.outputs.ghcr_image }}:buildcache,mode=max
